name: Manual Android APK Builder

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Compile Chef Bastion Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Setup Java JDK 21 (Required for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Install Web Dependencies & Build Production Bundle
        run: |
          npm install --legacy-peer-deps
          npm test
          npm run build

      - name: 5. Add Capacitor Android Platform & Sync Web Assets
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Lock Portrait Orientation (9:16) & Fix Gradle Wrapper Timeout
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q 'android:screenOrientation' "$MANIFEST"; then
            sed -i 's/<activity/<activity android:screenOrientation="portrait"/g' "$MANIFEST"
          fi
          WRAPPER_PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            sed -i 's/-all\.zip/-bin.zip/g' "$WRAPPER_PROPS"
            sed -i 's/networkTimeout=.*/networkTimeout=120000/g' "$WRAPPER_PROPS"
            if ! grep -q 'networkTimeout=' "$WRAPPER_PROPS"; then
              echo "networkTimeout=120000" >> "$WRAPPER_PROPS"
            fi
          fi

      - name: 7. Compile Installable Android APK (Gradle assembleDebug)
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle assembleDebug attempt $attempt..."
            ./gradlew assembleDebug --no-daemon \
              -Dorg.gradle.internal.http.socketTimeout=120000 \
              -Dorg.gradle.internal.http.connectionTimeout=120000 && break
            echo "Retrying after 5s..."
            sleep 5
          done

      - name: 8. Package APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./ChefBastion-v1.0.0-debug.apk

      - name: 9. Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChefBastion-Android-APK
          path: ./ChefBastion-v1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30
