name: CI · Chef Bastion

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Generar también el AAB firmado para Google Play'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tipado, tests y build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Instalar dependencias (bun.lock)
        run: bun install --frozen-lockfile
      - name: Tipado
        run: bun run lint
      - name: Tests
        run: bun run test
      - name: Build web
        run: bun run build

  android:
    name: Android (APK debug y AAB release)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build web y sincronizar Capacitor
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx cap sync android

      - name: Versión de la build
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            ./gradlew assembleDebug --no-daemon \
              -PversionCode=${{ steps.version.outputs.code }} \
              -PversionName=${{ steps.version.outputs.name }} && exit 0
            echo "Gradle falló (intento $attempt); reintentando en 5 s..."
            sleep 5
          done
          exit 1

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: ChefBastion-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Preparar keystore de release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto ANDROID_KEYSTORE_BASE64 (ver README, sección Android)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Compilar AAB firmado
        if: github.event_name == 'workflow_dispatch' && inputs.release
        working-directory: android
        env:
          CHEFBASTION_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CHEFBASTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHEFBASTION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHEFBASTION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}

      - name: Subir AAB firmado
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: actions/upload-artifact@v4
        with:
          name: ChefBastion-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
